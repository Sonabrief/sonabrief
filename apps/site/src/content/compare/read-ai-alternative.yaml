      audio_processing:
        sonabrief: "La trascrizione avviene sul tuo dispositivo. Il tuo audio non viene mai salvato come file."
        competitor: "Un assistente visibile entra nella chiamata; registrazioni e trascrizioni vengono archiviate nel cloud."
      meeting_sharing:
