      meeting_sharing:
        sonabrief: "Il tuo riepilogo resta con te. Nulla viene condiviso se non lo decidi tu."
        competitor: "Per impostazione predefinita, il resoconto della riunione viene inviato agli invitati, inclusi i partecipanti esterni."
      hosting:
        sonabrief: "Infrastruttura europea. Le sintesi cloud girano sui server europei di Mistral, che non conservano nulla una volta elaborata la richiesta (Zero Data Retention), oppure puoi tenere tutto in locale."
        competitor: "Archiviazione cloud negli Stati Uniti per impostazione predefinita. La residenza regionale dei dati è offerta ai clienti enterprise."
      data_for_training:
        sonabrief: "Le tue riunioni non vengono mai usate per addestrare alcun modello, e non c'è nessuna impostazione da sbagliare."
        competitor: "L'addestramento è disattivato per impostazione predefinita ed è opt-in. Su questo Read AI merita credito; la differenza è che Sonabrief non ha affatto questa opzione."
      open_source:
        sonabrief: "Open-source. Puoi leggere il codice che gestisce il tuo audio."
        competitor: "Proprietario."
    faq:
      - q: "Read AI addestra la sua AI sulle mie riunioni?"
        a: "Non per impostazione predefinita. La documentazione di Read AI dice che contribuire i tuoi dati ai suoi modelli è opt-in e disattivato finché non lo attivi tu, il che gli va riconosciuto. Con Sonabrief le tue riunioni non vengono mai usate per addestrare alcun modello, e poiché l'audio resta sul tuo dispositivo non c'è nemmeno un'impostazione da sbagliare."
      - q: "Un riepilogo della mia riunione verrà inviato ad altre persone?"
        a: "Con Sonabrief, no. Il tuo riepilogo resta con te e nulla viene condiviso se non lo decidi tu. Read AI, per sua stessa impostazione, invia il resoconto della riunione agli invitati dopo la chiamata, e questi possono includere partecipanti esterni. Per una conversazione riservata, quell'invio automatico è il problema."
      - q: "Un bot entra nella mia riunione?"
        a: "Con Read AI sì, entra come assistente visibile collegato al tuo calendario. Sonabrief cattura e trascrive sul tuo dispositivo, quindi non c'è nessun bot nella lista partecipanti e nessuna registrazione depositata sul server di qualcun altro."
      - q: "Dove vengono ospitati i miei dati?"
        a: "Sonabrief usa infrastruttura europea, e le sintesi cloud girano su server europei che non conservano nulla una volta elaborata la richiesta. Read AI archivia registrazioni e trascrizioni nel cloud, ospitato negli Stati Uniti per impostazione predefinita, con la residenza regionale offerta ai clienti enterprise."
      - q: "Sonabrief è adatto ad avvocati, terapeuti o giornalisti?"
        a: "Sì. Sono le persone per cui è nato. La trascrizione sul proprio dispositivo, senza alcun file audio conservato e senza nulla condiviso automaticamente, si adatta al lavoro regolato da segreto professionale, riservatezza o protezione delle fonti."
