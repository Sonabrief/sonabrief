        competitor: "Per impostazione predefinita, il resoconto della riunione viene inviato agli invitati, inclusi i partecipanti esterni."
      hosting:
        sonabrief: "Infrastruttura europea. Le sintesi cloud girano sui server europei di Mistral, che non conservano nulla una volta elaborata la richiesta (Zero Data Retention), oppure puoi tenere tutto in locale."
        competitor: "Archiviazione cloud negli Stati Uniti per impostazione predefinita. La residenza regionale dei dati è offerta ai clienti enterprise."
      data_for_training:
        sonabrief: "Le tue riunioni non vengono mai usate per addestrare alcun modello, e non c'è nessuna impostazione da sbagliare."
        competitor: "L'addestramento è disattivato per impostazione predefinita ed è opt-in. Su questo Read AI merita credito; la differenza è che Sonabrief non ha affatto questa opzione."
      open_source:
        sonabrief: "Open-source. Puoi leggere il codice che gestisce il tuo audio."
        competitor: "Proprietario."
    faq:
      - q: "Read AI addestra la sua AI sulle mie riunioni?"
        a: "Non per impostazione predefinita. La documentazione di Read AI dice che contribuire i tuoi dati ai suoi modelli è opt-in e disattivato finché non lo attivi tu, il che gli va riconosciuto. Con Sonabrief le tue riunioni non vengono mai usate per addestrare alcun modello, e poiché l'audio resta sul tuo dispositivo non c'è nemmeno un'impostazione da sbagliare."
      - q: "Un riepilogo della mia riunione verrà inviato ad altre persone?"
        a: "Con Sonabrief, no. Il tuo riepilogo resta con te e nulla viene condiviso se non lo decidi tu. Read AI, per sua stessa impostazione, invia il resoconto della riunione agli invitati dopo la chiamata, e questi possono includere partecipanti esterni. Per una conversazione riservata, quell'invio automatico è il problema."
      - q: "Un bot entra nella mia riunione?"
        a: "Con Read AI sì, entra come assistente visibile collegato al tuo calendario. Sonabrief cattura e trascrive sul tuo dispositivo, quindi non c'è nessun bot nella lista partecipanti e nessuna registrazione depositata sul server di qualcun altro."
      - q: "Dove vengono ospitati i miei dati?"
        a: "Sonabrief usa infrastruttura europea, e le sintesi cloud girano su server europei che non conservano nulla una volta elaborata la richiesta. Read AI archivia registrazioni e trascrizioni nel cloud, ospitato negli Stati Uniti per impostazione predefinita, con la residenza regionale offerta ai clienti enterprise."
      - q: "Sonabrief è adatto ad avvocati, terapeuti o giornalisti?"
        a: "Sì. Sono le persone per cui è nato. La trascrizione sul proprio dispositivo, senza alcun file audio conservato e senza nulla condiviso automaticamente, si adatta al lavoro regolato da segreto professionale, riservatezza o protezione delle fonti."

  fr:
    title: "L'alternative à Read AI qui place la confidentialité au premier plan — Sonabrief"
    description: "Sonabrief est une alternative privée à Read AI : la transcription se fait sur votre propre appareil, votre audio n'est jamais enregistré sous forme de fichier, et rien n'est partagé avec qui que ce soit sauf si vous choisissez de le partager."
    intro: |
      ## Une alternative privée à Read AI

      Read AI est un assistant de réunion soigné, et il mérite d'être crédité sur un point où beaucoup de ses rivaux trébuchent : il n'utilise pas le contenu de vos réunions pour entraîner son IA par défaut. Contribuer vos données à ses modèles relève du consentement explicite, désactivé tant que vous ne l'activez pas. Sur la seule question de l'entraînement, Read AI se comporte mieux que plusieurs outils plus connus, et il serait injuste de laisser entendre le contraire.

      La friction pour le travail confidentiel est ailleurs, dans la manière dont le produit traverse une réunion. Read AI rejoint vos appels en tant qu'assistant visible connecté à votre agenda et, par sa propre conception, envoie ensuite le compte rendu de réunion aux personnes invitées. Pour une synchro commerciale interne, c'est une commodité. Pour une consultation avec un client en présence d'une partie extérieure, cela signifie que la synthèse d'une conversation couverte par le secret professionnel peut atterrir automatiquement dans une boîte de réception externe, comme comportement par défaut plutôt que comme acte délibéré. Read AI stocke aussi les enregistrements et les transcriptions dans son cloud, hébergé aux États-Unis par défaut, la résidence régionale des données étant proposée aux clients entreprise.

      Sonabrief part d'un point de départ différent. La transcription se fait sur votre propre appareil, et votre audio n'est jamais enregistré sous forme de fichier. Rien n'est envoyé à personne sauf si vous décidez de l'envoyer. Il n'y a aucun bot dans la liste des participants, aucun compte rendu expédié à une salle pleine d'adresses externes, et aucun enregistrement posé dans un cloud américain en attente d'être demandé ou divulgué. Lorsque vous voulez une synthèse, vous choisissez comment : via Mistral sur des serveurs européens, qui ne conservent rien une fois une requête traitée, ou entièrement sur votre propre machine.

      Sur l'entraînement, nous sommes au même endroit que Read AI, et nous le disons clairement : aucun de nous deux n'utilise vos réunions pour entraîner des modèles par défaut. La différence, c'est qu'avec Sonabrief il n'y a aucun réglage à mal positionner, parce que l'audio ne quitte jamais votre appareil dès le départ, et qu'il n'y a donc rien sur quoi s'entraîner. Sonabrief est aussi open source, vous pouvez donc lire le code qui traite votre audio plutôt que de faire confiance à une page de politique.

      Si vos réunions sont de routine et de toute façon largement partagées, Read AI est un outil compétent. Si vous traitez des conversations qui ne doivent pas être diffusées à toutes les personnes invitées, et qui ne peuvent pas se trouver sur un serveur à l'étranger, Sonabrief a été conçu exactement pour cela. Les prix de Sonabrief sont en euros (Pro à 9 €/mois ou 89 €/an, Pro Unlimited à 19 €/mois ou 189 €/an), la différence entre les plans payants étant la durée de conservation de votre archive.
    differentiators:
      audio_processing:
        sonabrief: "La transcription se fait sur votre propre appareil. Votre audio n'est jamais enregistré sous forme de fichier."
        competitor: "Un assistant visible rejoint l'appel ; les enregistrements et les transcriptions sont stockés dans le cloud."
      meeting_sharing:
        sonabrief: "Votre synthèse reste avec vous. Rien n'est partagé sauf si vous choisissez de le partager."
        competitor: "Par défaut, le compte rendu de réunion est envoyé aux personnes invitées, y compris les participants externes."
      hosting:
        sonabrief: "Infrastructure européenne. Les synthèses dans le cloud tournent sur les serveurs européens de Mistral, qui ne conservent rien une fois la requête traitée (Zero Data Retention), ou vous pouvez tout garder entièrement en local."
        competitor: "Stockage cloud aux États-Unis par défaut. La résidence régionale des données est proposée aux clients entreprise."
      data_for_training:
        sonabrief: "Vos réunions ne servent jamais à entraîner aucun modèle, et il n'y a aucun réglage à mal positionner."
        competitor: "L'entraînement est désactivé par défaut et relève du consentement explicite. Read AI mérite d'être crédité sur ce point ; la différence est que Sonabrief n'a tout simplement pas cette option."
      open_source:
        sonabrief: "Open source. Vous pouvez lire le code qui traite votre audio."
        competitor: "Propriétaire."
    faq:
      - q: "Read AI entraîne-t-il son IA sur mes réunions ?"
        a: "Pas par défaut. La documentation de Read AI indique que contribuer vos données à ses modèles relève du consentement explicite et reste désactivé tant que vous ne l'activez pas, ce qui est à son honneur. Avec Sonabrief, vos réunions ne servent jamais à entraîner aucun modèle, et comme l'audio reste sur votre appareil, il n'y a dès le départ aucun réglage à mal positionner."
      - q: "Une synthèse de ma réunion sera-t-elle envoyée à d'autres personnes ?"
        a: "Avec Sonabrief, non. Votre synthèse reste avec vous et rien n'est partagé sauf si vous choisissez de le partager. Read AI, par sa propre conception, envoie le compte rendu de réunion aux personnes invitées après l'appel, ce qui peut inclure des participants externes. Pour une conversation confidentielle, cet envoi automatique est le problème."
      - q: "Un bot rejoint-il ma réunion ?"
        a: "Avec Read AI, oui ; il rejoint l'appel en tant qu'assistant visible connecté à votre agenda. Sonabrief capture et transcrit sur votre propre appareil, il n'y a donc aucun bot dans la liste des participants et aucun enregistrement stocké sur le serveur de quelqu'un d'autre."
      - q: "Où mes données sont-elles hébergées ?"
        a: "Sonabrief utilise une infrastructure européenne, et les synthèses dans le cloud tournent sur des serveurs européens qui ne conservent rien une fois la requête traitée. Read AI stocke les enregistrements et les transcriptions dans le cloud, hébergé aux États-Unis par défaut, la résidence régionale étant proposée aux clients entreprise."
      - q: "Sonabrief convient-il aux avocats, aux thérapeutes ou aux journalistes ?"
        a: "Oui. Ce sont les personnes pour qui il a été conçu. La transcription sur votre propre appareil, sans fichier audio conservé et sans rien de partagé automatiquement, convient à un travail régi par le secret professionnel, la confidentialité ou la protection des sources."

