  de:
    title: "Die datenschutzorientierte Alternative zu Read AI — Sonabrief"
    description: "Sonabrief ist eine private Alternative zu Read AI: Die Transkription läuft auf Ihrem eigenen Gerät, Ihr Audio wird nie als Datei gespeichert, und nichts wird mit irgendjemandem geteilt, es sei denn, Sie entscheiden sich, es zu teilen."
    intro: |
      ## Eine private Alternative zu Read AI

      Read AI ist ein gepflegter Meeting-Assistent, und in einem Punkt, an dem viele seiner Rivalen stolpern, gebührt ihm Anerkennung: Er verwendet die Inhalte Ihrer Besprechungen standardmäßig nicht, um seine KI zu trainieren. Ihre Daten zu seinen Modellen beizutragen, erfordert eine ausdrückliche Zustimmung und ist abgeschaltet, bis Sie es einschalten. Bei der einzelnen Frage des Trainings verhält sich Read AI besser als mehrere bekanntere Werkzeuge, und es wäre unfair, etwas anderes nahezulegen.

      Die Reibung für vertrauliche Arbeit liegt anderswo, darin, wie sich das Produkt durch eine Besprechung bewegt. Read AI tritt Ihren Anrufen als sichtbarer Assistent bei, der mit Ihrem Kalender verbunden ist, und versendet anschließend nach eigenem Design den Besprechungsbericht an die eingeladenen Personen. Für eine interne Vertriebsabstimmung ist das eine Bequemlichkeit. Für eine Mandantenberatung mit einer externen Partei im Raum bedeutet es, dass die Zusammenfassung eines der Verschwiegenheitspflicht unterliegenden Gesprächs automatisch in einem externen Postfach landen kann, als Standardverhalten statt als bewusste Handlung. Read AI speichert zudem Aufnahmen und Abschriften in seiner Cloud, standardmäßig in den Vereinigten Staaten gehostet, wobei regionale Datenresidenz Enterprise-Kunden angeboten wird.

      Sonabrief geht von einem anderen Ausgangspunkt aus. Die Transkription geschieht auf Ihrem eigenen Gerät, und Ihr Audio wird nie als Datei gespeichert. Es wird nichts an irgendjemanden gesendet, es sei denn, Sie entscheiden sich, es zu senden. Es gibt keinen Bot in der Teilnehmerliste, keinen Bericht, der an einen Raum voller externer Adressen versandt wird, und keine Aufnahme in einer US-Cloud, die darauf wartet, angefragt oder durchgesickert zu werden. Wenn Sie eine Zusammenfassung möchten, wählen Sie, wie: über Mistral auf europäischen Servern, die nach der Verarbeitung einer Anfrage nichts aufbewahren, oder vollständig auf Ihrer eigenen Maschine.

      Beim Training sind wir am selben Punkt wie Read AI, und wir sagen es klar: Keiner von uns beiden verwendet Ihre Besprechungen standardmäßig, um Modelle zu trainieren. Der Unterschied ist, dass es bei Sonabrief keinen Schalter gibt, den man falsch stellen könnte, weil das Audio von vornherein Ihr Gerät nie verlässt und es daher nichts gibt, womit man trainieren könnte. Sonabrief ist außerdem quelloffen, sodass Sie den Code lesen können, der Ihr Audio verarbeitet, statt einer Richtlinienseite zu vertrauen.

      Wenn Ihre Besprechungen Routine sind und ohnehin breit geteilt werden, ist Read AI ein fähiges Werkzeug. Wenn Sie Gespräche führen, die nicht an alle Eingeladenen verbreitet werden dürfen und nicht auf einem Server im Ausland liegen können, wurde Sonabrief genau dafür gebaut. Die Preise von Sonabrief sind in Euro (Pro für 9 €/Monat oder 89 €/Jahr, Pro Unlimited für 19 €/Monat oder 189 €/Jahr), wobei der Unterschied zwischen den bezahlten Plänen ist, wie lange Ihr Archiv aufbewahrt wird.
