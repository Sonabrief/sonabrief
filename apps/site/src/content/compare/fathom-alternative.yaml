    faq:
      - q: "Trainiert Fathom KI mit meinen Besprechungen?"
        a: "Nach seinen eigenen Nutzungsbedingungen kann Fathom je nach Ihren Kontoeinstellungen anonymisierte Daten aus dem Inhalt Ihrer Besprechungen verwenden, um seine internen KI-Modelle zu trainieren und zu verbessern, und Sie können dem in diesen Einstellungen widersprechen. Seine Vereinbarungen untersagen Anbietern wie OpenAI und Anthropic gesondert, mit Fathom-Daten zu trainieren. Bei Sonabrief werden Ihre Besprechungen nie zum Trainieren irgendeines Modells verwendet, und es gibt keine Einstellung, an die man denken müsste."
      - q: "Wo speichert Fathom meine Aufnahmen?"
        a: "Die eigene Dokumentation von Fathom besagt, dass alle Daten in den Rechenzentren von Amazon Web Services in den Vereinigten Staaten und Kanada gespeichert werden. Sonabrief transkribiert auf Ihrem Gerät, sodass das Audio nie hochgeladen wird; Cloud-Zusammenfassungen laufen, wenn Sie sie wählen, auf europäischen Servern, die nach der Verarbeitung der Anfrage nichts aufbewahren."
      - q: "Ist Sonabrief günstiger als Fathom?"
        a: "Nicht beim reinen Volumen. Der kostenlose Plan von Fathom bietet unbegrenzte Aufnahme und Transkription, was der kostenlose Plan von Sonabrief nicht erreicht. Der Vorteil von Sonabrief ist nicht der Preis, sondern dass Ihr Audio von vornherein nie Ihr Gerät verlässt. Die Wahl betrifft, wo Ihre Daten liegen, nicht wie viele Minuten Sie bekommen."
      - q: "Tritt bei Sonabrief ein Bot meiner Besprechung bei?"
        a: "Nein. Fathom schickt einen sichtbaren Teilnehmer, den Fathom Notetaker, in den Anruf. Sonabrief erfasst und transkribiert auf Ihrem eigenen Gerät, sodass es keinen Bot in der Teilnehmerliste und keine Aufnahme auf dem Server eines anderen gibt."
      - q: "Ist Sonabrief für Anwälte, Therapeuten oder Journalisten geeignet?"
        a: "Ja. Das sind die Menschen, für die es gebaut wurde. Die Transkription auf Ihrem eigenen Gerät, ohne gespeicherte Audiodatei und ohne standardmäßiges Training mit Ihren Inhalten, passt zu Arbeit, die der Verschwiegenheitspflicht, der Vertraulichkeit oder dem Quellenschutz unterliegt."
