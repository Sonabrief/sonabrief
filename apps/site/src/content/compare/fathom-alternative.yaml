    description: "Sonabrief es una alternativa privada a Fathom: la transcripción se realiza en tu propio dispositivo, tu audio nunca se guarda como archivo, y tus reuniones nunca se usan para entrenar ningún modelo de IA."
    intro: |
      ## Una alternativa privada a Fathom

      Fathom es realmente bueno, y su plan gratuito es realmente generoso. Grabación, transcripción y almacenamiento ilimitados sin coste es algo raro, y si la privacidad no es tu preocupación principal, Fathom es una opción razonable. Sería deshonesto fingir lo contrario, y una comparación que solo atacara a Fathom no valdría la pena leerse.

      Pero "gratis" tiene un diseño detrás, y ese diseño vale la pena entenderlo. Fathom se une a tu llamada como participante visible, el "Fathom Notetaker", y sube la grabación a los centros de datos de Amazon Web Services en Estados Unidos y Canadá. Sus propias condiciones del servicio dicen que, según los ajustes de tu cuenta, Fathom puede usar datos anonimizados procedentes del contenido de tus reuniones para entrenar y mejorar sus modelos de IA internos. Puedes desactivarlo, pero el interruptor es cosa tuya recordarlo, y está activado por defecto. Para una llamada comercial corriente puede ser un trato justo. Para una conversación amparada por el secreto profesional es una decisión que tienes que tomar activamente, cada vez que olvidas revisar un ajuste.

      Sonabrief está construido al revés. La transcripción se realiza en tu propio dispositivo, y tu audio nunca se guarda como archivo. No hay ninguna grabación subida a una nube estadounidense o canadiense, y no hay ninguna opción de exclusión que recordar, porque no hay nada de lo que excluirse: tus reuniones nunca se usan para entrenar ningún modelo, ni el nuestro ni el de nadie. Cuando quieres un resumen, eliges cómo: a través de Mistral en servidores europeos, que no conservan nada una vez procesada una petición, o por completo en tu propia máquina.

      Seamos claros con el precio, porque es aquí donde Fathom gana en volumen. El plan gratuito de Fathom graba y transcribe sin límites, mientras que sus resúmenes de IA avanzados están limitados a cinco llamadas al mes antes de reducirse a una plantilla básica. El plan gratuito de Sonabrief conserva tu archivo durante siete días, lo que es menos generoso en cantidad pura. No somos la herramienta más barata para quien solo quiere grabación en la nube ilimitada. Somos la herramienta para quien no puede permitirse que sus grabaciones estén en el servidor de un tercero, desde el principio. Los precios de Sonabrief están en euros (Pro a 9 €/mes o 89 €/año, Pro Unlimited a 19 €/mes o 189 €/año), y la diferencia entre los planes de pago es cuánto tiempo se conserva tu archivo.

      Sonabrief es además de código abierto, así que no tienes que creer en nuestra palabra sobre cómo se trata el audio. Puedes leer el código. Si quieres una grabación en la nube gratuita y generosa y las cuestiones de privacidad no aplican a tu trabajo, Fathom es una opción estupenda. Si tus conversaciones no pueden salir de tu control, Sonabrief se construyó exactamente para eso.
