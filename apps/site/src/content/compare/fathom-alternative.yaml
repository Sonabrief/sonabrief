    intro: |
      ## Eine private Alternative zu Fathom

      Fathom ist wirklich gut, und sein kostenloser Plan ist wirklich großzügig. Unbegrenztes Aufnehmen, Transkribieren und Speichern ohne Kosten ist selten, und wenn Datenschutz nicht Ihr Hauptanliegen ist, ist Fathom eine vernünftige Wahl. Es wäre unredlich, etwas anderes vorzugeben, und ein Vergleich, der Fathom nur angreift, wäre nicht lesenswert.

      Aber hinter "kostenlos" steckt ein Entwurf, und dieser Entwurf ist es wert, verstanden zu werden. Fathom tritt Ihrem Anruf als sichtbarer Teilnehmer bei, der "Fathom Notetaker", und lädt die Aufnahme in die Rechenzentren von Amazon Web Services in den Vereinigten Staaten und Kanada hoch. Seine eigenen Nutzungsbedingungen besagen, dass Fathom je nach Ihren Kontoeinstellungen anonymisierte Daten aus dem Inhalt Ihrer Besprechungen verwenden kann, um seine internen KI-Modelle zu trainieren und zu verbessern. Sie können das abschalten, aber den Schalter müssen Sie sich selbst merken, und er ist standardmäßig aktiv. Für einen gewöhnlichen Vertriebsanruf mag das ein fairer Tausch sein. Für ein der Verschwiegenheitspflicht unterliegendes Gespräch ist es eine Entscheidung, die Sie aktiv treffen müssen, jedes Mal, wenn Sie vergessen, eine Einstellung zu prüfen.

      Sonabrief ist andersherum gebaut. Die Transkription geschieht auf Ihrem eigenen Gerät, und Ihr Audio wird nie als Datei gespeichert. Es gibt keine Aufnahme, die in eine US- oder kanadische Cloud hochgeladen wird, und kein Opt-out, an das man denken müsste, weil es nichts gibt, dem man widersprechen könnte: Ihre Besprechungen werden nie zum Trainieren irgendeines Modells verwendet, weder unseres noch das von irgendjemandem. Wenn Sie eine Zusammenfassung möchten, wählen Sie, wie: über Mistral auf europäischen Servern, die nach der Verarbeitung einer Anfrage nichts aufbewahren, oder vollständig auf Ihrer eigenen Maschine.

      Wir sollten beim Preis ehrlich sein, denn hier gewinnt Fathom beim Volumen. Der kostenlose Plan von Fathom nimmt unbegrenzt auf und transkribiert, während seine fortgeschrittenen KI-Zusammenfassungen auf fünf Anrufe pro Monat begrenzt sind, bevor sie auf eine einfache Vorlage zurückfallen. Der kostenlose Plan von Sonabrief bewahrt Ihr Archiv sieben Tage lang auf, was in reiner Menge weniger großzügig ist. Wir sind nicht das günstigere Werkzeug für jemanden, der einfach nur unbegrenzte Cloud-Aufnahmen will. Wir sind das Werkzeug für jemanden, dessen Aufnahmen von vornherein nicht auf dem Server eines Dritten liegen dürfen. Die Preise von Sonabrief sind in Euro (Pro für 9 €/Monat oder 89 €/Jahr, Pro Unlimited für 19 €/Monat oder 189 €/Jahr), und der Unterschied zwischen den bezahlten Plänen ist, wie lange Ihr Archiv aufbewahrt wird.

      Sonabrief ist außerdem quelloffen, sodass Sie uns nicht aufs Wort glauben müssen, wie das Audio behandelt wird. Sie können den Code lesen. Wenn Sie großzügige kostenlose Cloud-Aufnahmen wollen und die Datenschutzfragen für Ihre Arbeit nicht gelten, ist Fathom eine gute Wahl. Wenn Ihre Gespräche Ihre Kontrolle nicht verlassen dürfen, wurde Sonabrief genau dafür gebaut.
