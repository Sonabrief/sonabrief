        competitor: "Gratuit (enregistrement illimité, synthèses IA avancées plafonnées à 5 appels/mois), plans payants à partir d'environ 16 $/mois. Prix en USD, par utilisateur."
      open_source:
        sonabrief: "Open source. Vous pouvez lire le code qui traite votre audio."
        competitor: "Propriétaire."
    faq:
