      hosting:
        sonabrief: "Infrastruttura europea. Le sintesi cloud girano sui server europei di Mistral, che non conservano nulla una volta elaborata la richiesta (Zero Data Retention), oppure puoi tenere tutto in locale."
        competitor: "Archiviazione ed elaborazione su Amazon Web Services, Stati Uniti."
      pricing:
        sonabrief: "Free, Pro 9 €/mese (89 €/anno), Pro Unlimited 19 €/mese (189 €/anno). Prezzi in euro."
        competitor: "Free (300 min/mese), Pro 8,33 $/mese annuale, Business 19,99 $/utente/mese annuale. Prezzi in USD."
