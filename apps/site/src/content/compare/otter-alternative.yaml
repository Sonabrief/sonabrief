i18n:
  en:
    title: "The Privacy-First Otter.ai Alternative — Sonabrief"
    description: "Sonabrief is a private alternative to Otter.ai: transcription runs on your own device, your audio is never saved as a file, and your data never trains any AI model."
    intro: |
      ## A private alternative to Otter.ai

      Otter.ai is a capable meeting assistant, but its design is built around the cloud. Otter's own Terms of Service say that audio is uploaded and processed on cloud servers. Its Privacy Policy says that recordings and transcripts are used to train Otter's own AI models, and that storage and processing run on Amazon Web Services in the United States.

      For most people that trade-off is invisible. For lawyers, therapists, journalists and consultants, it is the whole question. When a conversation is privileged, confidential or protected by professional secrecy, "uploaded to a US cloud and used to train models" is not a small print detail. It is a reason not to record at all.

      Sonabrief was built the other way around. The transcription happens on your own device, and your audio is never saved as a file. There is no recording sitting on a server, waiting to be subpoenaed, leaked or reused. When you want AI to summarise a meeting, you decide how: synthesis through Mistral on European servers, where nothing is kept once your request has been processed, or fully on your own machine, where nothing ever leaves it. Either way, your data is never used to train a model. Not ours, not anyone's.

      The practical differences all follow from that one decision. Otter's free plan stops recording after 30 minutes and lets you import only a handful of files in total. Sonabrief's prices are in euros, with a free plan and two paid plans (Pro at €9/month or €89/year, Pro Unlimited at €19/month or €189/year). The main difference between the paid plans is how long your archive is kept, not how many minutes you are allowed to think.

      Sonabrief is also open-source. You do not have to take our word for how your audio is handled. You can read the code yourself. For a product whose whole promise is privacy, that openness is the point.

      If you want a meeting assistant that simply works in the cloud, Otter is a reasonable choice. If you handle conversations that cannot leave your control, Sonabrief was built for exactly that.
    differentiators:
      audio_processing:
        sonabrief: "Transcription happens on your own device. Your audio is never saved as a file."
        competitor: "Audio is uploaded and processed on cloud servers."
      data_for_training:
        sonabrief: "Your data is never used to train any model."
        competitor: "Recordings and transcripts are used to train Otter's own AI models."
      hosting:
        sonabrief: "European infrastructure. Cloud summaries run on Mistral's European servers, which keep nothing once a request is processed (Zero Data Retention), or you can keep everything fully local."
        competitor: "Storage and processing on Amazon Web Services, United States."
      pricing:
        sonabrief: "Free, Pro €9/month (€89/year), Pro Unlimited €19/month (€189/year). Prices in euros."
        competitor: "Free (300 min/month), Pro $8.33/month yearly, Business $19.99/user/month yearly. Prices in USD."
      languages:
        sonabrief: "99 languages, with the highest accuracy on the main European and business languages."
        competitor: "A narrower selection of languages."
    faq:
      - q: "Is Sonabrief really private, or is that just marketing?"
        a: "The transcription happens on your own device and your audio is never saved as a file. Sonabrief is open-source, so anyone can check how the data is handled by reading the code, rather than taking it on trust."
      - q: "Does Sonabrief upload my audio to the cloud, the way Otter does?"
        a: "No. Your audio is transcribed on your device and is never written to a file or uploaded. Only if you choose cloud summaries does any text (never the audio) go to Mistral's European servers, which keep nothing once the request is processed. You can also keep the whole process on your own machine."
      - q: "Will my meetings be used to train AI models?"
        a: "No. Your data is never used to train any model. Otter's Privacy Policy, by contrast, says that recordings and transcripts are used to train its own AI."
      - q: "Where is my data hosted?"
        a: "Sonabrief uses European infrastructure, and cloud summaries run on European servers. Otter's Privacy Policy says it uses Amazon Web Services in the United States."
      - q: "Is Sonabrief a good fit for lawyers, therapists or journalists?"
        a: "Yes. Those are the people it was built for. Transcription on your own device, with no stored audio file, fits work that is governed by professional secrecy, confidentiality or source protection."

  it:
    title: "L'alternativa a Otter.ai che mette la privacy al primo posto — Sonabrief"
    description: "Sonabrief è un'alternativa privata a Otter.ai: la trascrizione avviene sul tuo dispositivo, il tuo audio non viene mai salvato come file e i tuoi dati non addestrano alcun modello AI."
    intro: |
      ## Un'alternativa privata a Otter.ai

      Otter.ai è un assistente per riunioni valido, ma è pensato intorno al cloud. I suoi stessi Termini di Servizio dicono che l'audio viene caricato ed elaborato su server cloud. La sua Privacy Policy dice che registrazioni e trascrizioni vengono usate per addestrare i modelli AI di Otter, e che archiviazione ed elaborazione avvengono su Amazon Web Services, negli Stati Uniti.

      Per la maggior parte delle persone questo compromesso è invisibile. Per avvocati, terapeuti, giornalisti e consulenti, è invece tutta la questione. Quando una conversazione è coperta da segreto professionale, riservata o protetta, "caricata su un cloud statunitense e usata per addestrare modelli" non è una riga in piccolo. È un motivo per non registrare affatto.

      Sonabrief è costruito al contrario. La trascrizione avviene sul tuo dispositivo, e il tuo audio non viene mai salvato come file. Non c'è alcuna registrazione su un server, in attesa di essere richiesta da un'autorità, trafugata o riutilizzata. Quando vuoi che l'AI riassuma una riunione, decidi tu come: con la sintesi tramite Mistral su server europei, che non conservano nulla una volta elaborata la richiesta, oppure tutto sulla tua macchina, dove niente esce mai. In entrambi i casi, i tuoi dati non vengono mai usati per addestrare un modello. Né il nostro, né quello di nessun altro.

      Le differenze pratiche nascono tutte da questa scelta. Il piano gratuito di Otter smette di registrare dopo 30 minuti e ti lascia importare solo pochi file in tutto. I prezzi di Sonabrief sono in euro, con un piano gratuito e due a pagamento (Pro a 9 €/mese o 89 €/anno, Pro Unlimited a 19 €/mese o 189 €/anno). La differenza principale tra i piani a pagamento è per quanto tempo viene conservato il tuo archivio, non quanti minuti ti è concesso pensare.

      Sonabrief è anche open-source. Non devi fidarti della nostra parola su come viene gestito il tuo audio. Puoi leggere il codice tu stesso. Per un prodotto la cui intera promessa è la privacy, quella apertura è il punto.

      Se cerchi un assistente per riunioni che funzioni semplicemente nel cloud, Otter è una scelta ragionevole. Se gestisci conversazioni che non possono uscire dal tuo controllo, Sonabrief è nato esattamente per questo.
