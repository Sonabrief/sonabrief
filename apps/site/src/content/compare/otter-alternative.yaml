    faq:
      - q: "Sonabrief è davvero privato o è solo marketing?"
        a: "La trascrizione avviene sul tuo dispositivo e il tuo audio non viene mai salvato come file. Sonabrief è open-source, quindi chiunque può controllare come vengono gestiti i dati leggendo il codice, senza doversi fidare sulla parola."
      - q: "Sonabrief carica il mio audio nel cloud, come fa Otter?"
        a: "No. Il tuo audio viene trascritto sul dispositivo e non viene mai scritto su file né caricato. Solo se scegli le sintesi cloud viene inviato del testo (mai l'audio) ai server europei di Mistral, che non conservano nulla una volta elaborata la richiesta. Puoi anche tenere l'intero processo sulla tua macchina."
      - q: "Le mie riunioni verranno usate per addestrare modelli AI?"
        a: "No. I tuoi dati non vengono mai usati per addestrare alcun modello. La Privacy Policy di Otter, al contrario, dice che registrazioni e trascrizioni vengono usate per addestrare la sua AI."
      - q: "Dove vengono ospitati i miei dati?"
        a: "Sonabrief usa infrastruttura europea, e le sintesi cloud girano su server europei. La Privacy Policy di Otter dice invece che usa Amazon Web Services, negli Stati Uniti."
      - q: "Sonabrief è adatto ad avvocati, terapeuti o giornalisti?"
        a: "Sì. Sono le persone per cui è nato. La trascrizione sul proprio dispositivo, senza alcun file audio conservato, si adatta al lavoro regolato da segreto professionale, riservatezza o protezione delle fonti."