        competitor: "L'audio est téléversé et stocké, chiffré, sur des serveurs cloud."
      hosting:
        sonabrief: "Infrastructure européenne, ou entièrement en local. Les synthèses dans le cloud tournent sur des serveurs européens qui ne conservent rien une fois la requête traitée."
        competitor: "Infrastructure cloud américaine par défaut en self-service. Le stockage UE est optionnel, mais le traitement a toujours lieu aux États-Unis."
      data_ownership:
        sonabrief: "Vos données ne servent jamais à entraîner aucun modèle, et votre audio ne quitte pas votre appareil sauf si vous choisissez une synthèse dans le cloud."
        competitor: "Indique ne pas utiliser votre contenu pour entraîner des modèles d'IA, mais votre contenu est tout de même téléversé et conservé sur ses serveurs."
      pricing:
        sonabrief: "Gratuit, Pro 9 €/mois (89 €/an), Pro Unlimited 19 €/mois (189 €/an). Prix en euros, sans facturation par utilisateur."
        competitor: "Gratuit (800 min de stockage), Pro 10 $/utilisateur/mois en annuel, Business 19 $/utilisateur/mois en annuel. Par utilisateur, en USD, avec un système de crédits d'IA."
      open_source:
        sonabrief: "Open source. Le code qui traite votre audio peut être inspecté directement."
        competitor: "Propriétaire. Vous vous en remettez à la politique de confidentialité publiée."
    faq:
      - q: "Fireflies entraîne-t-il son IA sur mes réunions ?"
        a: "Non. La propre politique de confidentialité de Fireflies indique qu'il n'utilise pas le contenu de vos réunions pour entraîner des modèles d'IA et qu'il l'interdit contractuellement à ses prestataires. Sonabrief ne s'entraîne pas non plus sur vos données. La différence entre les deux est l'endroit où réside votre audio, pas le fait d'entraîner un modèle."
      - q: "Alors pourquoi choisir Sonabrief plutôt que Fireflies ?"
        a: "Parce que Sonabrief transcrit sur votre propre appareil et n'enregistre jamais votre audio sous forme de fichier, tandis que Fireflies téléverse et stocke votre audio sur ses serveurs cloud. Pour un travail confidentiel, un enregistrement qui n'a jamais été téléversé est plus sûr qu'un enregistrement chiffré posé sur un serveur à l'étranger."
      - q: "Où mes données sont-elles hébergées avec chaque outil ?"
        a: "Avec Sonabrief, la transcription est sur votre appareil et les synthèses dans le cloud tournent sur des serveurs européens qui ne conservent rien après traitement. La propre documentation de Fireflies indique que les comptes self-service stockent et traitent les données sur une infrastructure cloud américaine par défaut ; le stockage UE est optionnel mais le traitement reste aux États-Unis."
      - q: "Sonabrief est-il vraiment privé, ou est-ce seulement du marketing ?"
        a: "Sonabrief est open source : le code qui traite votre audio peut donc être lu et vérifié plutôt que pris sur parole. La transcription sur votre appareil, sans fichier audio conservé, est quelque chose que vous pouvez vérifier plutôt que devoir croire."
      - q: "Sonabrief convient-il aux avocats, aux thérapeutes ou aux journalistes ?"
        a: "Oui. Ce sont les personnes pour qui il a été conçu. La transcription sur l'appareil, sans fichier audio conservé, convient à un travail régi par le secret professionnel, la confidentialité ou la protection des sources, où une copie de l'enregistrement dans le cloud est en soi le risque."

