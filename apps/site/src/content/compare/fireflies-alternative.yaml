  de:
    title: "Die datenschutzorientierte Alternative zu Fireflies.ai — Sonabrief"
    description: "Sonabrief ist eine private Alternative zu Fireflies.ai: Die Transkription läuft auf Ihrem eigenen Gerät und Ihr Audio wird nie als Datei gespeichert, statt auf Cloud-Servern hochgeladen und gespeichert zu werden."
    intro: |
      ## Eine private Alternative zu Fireflies.ai

      Fireflies.ai ist ein fähiger Meeting-Assistent, und in einem Punkt ist er wirklich gut: Seine eigene Datenschutzrichtlinie besagt, dass er die Inhalte Ihrer Besprechungen nicht zum Trainieren von KI-Modellen verwendet und dies seinen Auftragsverarbeitern vertraglich untersagt. Das ist wichtig, und es ist es wert, klar gesagt zu werden, statt das Gegenteil vorzugeben.

      Der wahre Unterschied zwischen Fireflies und Sonabrief ist nicht, was mit Ihren Daten geschieht, sondern wo Ihre Daten liegen. Fireflies ist um die Cloud herum gebaut. Seine eigene Dokumentation besagt, dass das Audio hochgeladen und verschlüsselt auf seinen Servern gespeichert wird, und dass für jeden, der sich über den üblichen Self-Service-Weg anmeldet, die Daten standardmäßig auf US-Cloud-Infrastruktur gespeichert und verarbeitet werden. Europäische Speicherung gibt es als Option, aber selbst dann findet die Verarbeitung in den USA statt. Privater Speicher und Bring-your-own-Storage sind dem Enterprise-Plan vorbehalten.

      Für die meisten Teams ist das unsichtbar. Für einen Anwalt, einen Therapeuten, einen Journalisten oder einen Berater ist der Speicherort der Aufnahme die ganze Frage. Ein vertrauliches Gespräch, das hochgeladen und auf einem Server im Ausland aufbewahrt wird, ist eine Aufnahme, die angeordnet, angefragt oder in einem Datenleck offengelegt werden kann, so gut die Verschlüsselung auch sein mag. Die sicherste Aufnahme ist die, die nie hochgeladen wurde.

      Das ist die Grundannahme, von der Sonabrief ausgeht. Die Transkription geschieht auf Ihrem eigenen Gerät, und Ihr Audio wird nie als Datei gespeichert. Es gibt keine Kopie auf einem Server, die darauf wartet, zum Problem zu werden. Wenn Sie eine Zusammenfassung möchten, entscheiden Sie, wie: eine Synthese auf europäischen Servern, die nach der Verarbeitung Ihrer Anfrage nichts aufbewahren, oder vollständig auf Ihrer eigenen Maschine, von der nie etwas weggeht. Wie Fireflies verwendet Sonabrief Ihre Daten nie zum Trainieren eines Modells. Anders als bei Fireflies muss Ihr Audio Ihren Computer nicht verlassen, damit das Produkt funktioniert.

      Sonabrief ist außerdem quelloffen. Sie müssen keinem Datenschutzversprechen auf einer Marketingseite vertrauen. Sie können den Code lesen, der Ihr Audio verarbeitet. Seine Preise sind in Euro, mit einem kostenlosen Plan und zwei bezahlten Plänen (Pro für 9 €/Monat oder 89 €/Jahr, Pro Unlimited für 19 €/Monat oder 189 €/Jahr), ohne Abrechnung pro Nutzer und ohne KI-Guthabensystem, das man im Auge behalten muss.

      Wenn Ihr Team vor allem Cloud-Komfort und eine tiefe CRM-Automatisierung braucht, ist Fireflies eine vernünftige Wahl. Wenn Sie Gespräche führen, die Ihre Kontrolle nicht verlassen sollten, wurde Sonabrief genau dafür gebaut.
