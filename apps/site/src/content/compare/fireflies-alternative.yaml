      hosting:
        sonabrief: "Infrastruttura europea, oppure tutto in locale. Le sintesi cloud girano su server europei che non conservano nulla una volta elaborata la richiesta."
        competitor: "Infrastruttura cloud statunitense per impostazione predefinita nel self-service. Lo storage UE è opzionale, ma l'elaborazione resta negli USA."
      data_ownership:
        sonabrief: "I tuoi dati non vengono mai usati per addestrare alcun modello, e l'audio non lascia il dispositivo a meno che tu non scelga una sintesi cloud."
        competitor: "Dichiara di non usare i tuoi contenuti per addestrare modelli AI, ma i contenuti vengono comunque caricati e conservati sui suoi server."
      pricing:
        sonabrief: "Free, Pro 9 €/mese (89 €/anno), Pro Unlimited 19 €/mese (189 €/anno). Prezzi in euro, nessuna fatturazione per utente."
        competitor: "Free (800 min di storage), Pro 10 $/utente/mese annuale, Business 19 $/utente/mese annuale. Per utente, in USD, con un sistema di crediti AI."
      open_source:
        sonabrief: "Open source. Il codice che gestisce il tuo audio può essere ispezionato direttamente."
        competitor: "Proprietario. Ti affidi alla privacy policy pubblicata."
    faq:
      - q: "Fireflies addestra la sua AI sulle mie riunioni?"
        a: "No. La stessa Privacy Policy di Fireflies dice che non usa i contenuti delle riunioni per addestrare modelli AI e che lo vieta contrattualmente ai propri fornitori. Nemmeno Sonabrief addestra sui tuoi dati. La differenza tra i due è dove vive il tuo audio, non se addestra un modello."
      - q: "Allora perché scegliere Sonabrief invece di Fireflies?"
        a: "Perché Sonabrief trascrive sul tuo dispositivo e non salva mai l'audio come file, mentre Fireflies carica e archivia il tuo audio sui suoi server cloud. Per il lavoro riservato, una registrazione mai caricata è più sicura di una cifrata che resta su un server all'estero."
      - q: "Dove vengono ospitati i miei dati con ciascuno strumento?"
        a: "Con Sonabrief, la trascrizione è sul dispositivo e le sintesi cloud girano su server europei che non conservano nulla dopo l'elaborazione. La documentazione di Fireflies dice che gli account self-service archiviano ed elaborano i dati su infrastruttura cloud statunitense per impostazione predefinita; lo storage UE è opzionale ma l'elaborazione resta negli USA."
      - q: "Sonabrief è davvero privato o è solo marketing?"
        a: "Sonabrief è open source, quindi il codice che gestisce il tuo audio può essere letto e verificato invece di essere preso sulla fiducia. La trascrizione sul dispositivo, senza alcun file audio conservato, è qualcosa che puoi verificare invece di dover credere."
      - q: "Sonabrief è adatto ad avvocati, terapeuti o giornalisti?"
        a: "Sì. Sono le persone per cui è nato. La trascrizione sul dispositivo, senza alcun file audio conservato, si adatta al lavoro regolato da segreto professionale, riservatezza o protezione delle fonti, dove una copia cloud della registrazione è essa stessa il rischio."

  fr:
    title: "L'alternative à Fireflies.ai qui place la confidentialité au premier plan — Sonabrief"
    description: "Sonabrief est une alternative privée à Fireflies.ai : la transcription se fait sur votre propre appareil et votre audio n'est jamais enregistré sous forme de fichier, au lieu d'être téléversé et stocké sur des serveurs cloud."
    intro: |
      ## Une alternative privée à Fireflies.ai

      Fireflies.ai est un assistant de réunion compétent, et sur un point il est réellement bon : sa propre politique de confidentialité indique qu'il n'utilise pas le contenu de vos réunions pour entraîner des modèles d'IA, et qu'il l'interdit contractuellement à ses prestataires. C'est important, et cela mérite d'être dit clairement plutôt que de prétendre le contraire.

      La vraie différence entre Fireflies et Sonabrief n'est pas ce qu'il advient de vos données, mais où vos données résident. Fireflies est bâti autour du cloud. Sa propre documentation indique que l'audio est téléversé et stocké, chiffré, sur ses serveurs, et que pour quiconque s'inscrit via le parcours self-service habituel, les données sont stockées et traitées sur une infrastructure cloud américaine par défaut. Un stockage européen existe en option, mais même dans ce cas le traitement a lieu aux États-Unis. Le stockage privé et le bring-your-own-storage sont réservés à l'offre Enterprise.

      Pour la plupart des équipes, c'est invisible. Pour un avocat, un thérapeute, un journaliste ou un consultant, l'emplacement de l'enregistrement est toute la question. Une conversation confidentielle téléversée et conservée sur un serveur à l'étranger est un enregistrement qui peut être réquisitionné, demandé ou exposé dans une fuite, aussi bon que soit le chiffrement. L'enregistrement le plus sûr est celui qui n'a jamais été téléversé.

      C'est le présupposé dont part Sonabrief. La transcription se fait sur votre propre appareil, et votre audio n'est jamais enregistré sous forme de fichier. Il n'y a aucune copie sur un serveur en attente de devenir un problème. Lorsque vous voulez une synthèse, vous décidez comment : une synthèse sur des serveurs européens qui ne conservent rien une fois votre requête traitée, ou entièrement sur votre propre machine, d'où rien ne sort jamais. Comme Fireflies, Sonabrief n'utilise jamais vos données pour entraîner un modèle. Contrairement à Fireflies, votre audio n'a pas besoin de quitter votre ordinateur pour que le produit fonctionne.

      Sonabrief est aussi open source. Vous n'avez pas à faire confiance à une promesse de confidentialité écrite sur une page marketing. Vous pouvez lire le code qui traite votre audio. Ses prix sont en euros, avec un plan gratuit et deux plans payants (Pro à 9 €/mois ou 89 €/an, Pro Unlimited à 19 €/mois ou 189 €/an), sans facturation par utilisateur ni système de crédits d'IA à surveiller.

      Si votre équipe a surtout besoin de la commodité du cloud et d'une automatisation CRM poussée, Fireflies est un choix raisonnable. Si vous traitez des conversations qui ne devraient pas quitter votre contrôle, Sonabrief a été conçu exactement pour cela.
    differentiators:
