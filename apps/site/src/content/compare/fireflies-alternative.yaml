      ## Una alternativa privada a Fireflies.ai

      Fireflies.ai es un asistente de reuniones competente, y en un punto es honestamente bueno: su propia política de privacidad dice que no usa el contenido de tus reuniones para entrenar modelos de IA, y que se lo prohíbe contractualmente a sus proveedores. Eso importa, y vale la pena decirlo con claridad en lugar de fingir lo contrario.

      La verdadera diferencia entre Fireflies y Sonabrief no es qué ocurre con tus datos, sino dónde residen. Fireflies está construido en torno a la nube. Su propia documentación dice que el audio se sube y se almacena, cifrado, en sus servidores, y que para cualquiera que se registre por el flujo self-service habitual los datos se almacenan y procesan en infraestructura cloud estadounidense por defecto. El almacenamiento europeo existe como opción, pero incluso entonces el procesamiento ocurre en Estados Unidos. El almacenamiento privado y el bring-your-own-storage están reservados al plan Enterprise.

      Para la mayoría de los equipos eso es invisible. Para un abogado, un terapeuta, un periodista o un consultor, la ubicación de la grabación es toda la cuestión. Una conversación confidencial subida y conservada en un servidor en el extranjero es una grabación que puede ser requerida judicialmente, solicitada o expuesta en una brecha, por buena que sea la cifrado. La grabación más segura es la que nunca se subió.

      Ese es el planteamiento del que parte Sonabrief. La transcripción se realiza en tu propio dispositivo, y tu audio nunca se guarda como archivo. No hay ninguna copia alojada en un servidor a la espera de convertirse en un problema. Cuando quieres un resumen, decides cómo: una síntesis en servidores europeos que no conservan nada una vez procesada tu petición, o por completo en tu propia máquina, de donde nada sale jamás. Como Fireflies, Sonabrief nunca usa tus datos para entrenar un modelo. A diferencia de Fireflies, tu audio no tiene que salir de tu ordenador para que el producto funcione.

      Sonabrief es además de código abierto. No tienes que confiar en una promesa de privacidad escrita en una página de marketing. Puedes leer el código que trata tu audio. Sus precios están en euros, con un plan gratuito y dos planes de pago (Pro a 9 €/mes o 89 €/año, Pro Unlimited a 19 €/mes o 189 €/año), sin facturación por usuario ni sistema de créditos de IA que vigilar.

      Si tu equipo necesita sobre todo la comodidad de la nube y una automatización profunda del CRM, Fireflies es una opción razonable. Si manejas conversaciones que no deberían salir de tu control, Sonabrief se construyó exactamente para eso.
