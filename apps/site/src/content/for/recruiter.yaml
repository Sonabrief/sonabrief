i18n:
  en:
    profession: "For recruiters"
    painPoints:
      - "Interview recordings hold candidates' personal data and candid assessments"
      - "A general purpose cloud tool stores that data abroad, outside your control"
      - "Time lost writing up interviews instead of talking to people"
    title: "Sonabrief for recruiters: candidate interviews handled with care"
    description: "A meeting assistant for recruiters built around candidate data protection. You choose, before each recording, whether the audio is transcribed on your own device or on European servers. The recording is never kept as a file."
    intro: |
      An interview recording is a dense file of someone's personal data: their history, their current situation, sometimes things they would only tell you in confidence, plus the candid assessment that follows. Under data protection law a candidate has rights over all of it, and they have not agreed to have their voice processed on servers abroad or reused to improve someone's model. Most general purpose transcription tools do exactly that. For a recruiter who depends on candidates trusting the process, that is a quiet liability sitting in the background of every conversation.

      Sonabrief starts from a different assumption. Before each recording you decide how the audio is handled. You can transcribe entirely **on your own device**, so the recording is never uploaded anywhere. Or you can choose to transcribe on **European servers** when you need more speed, in which case the audio is processed in the EU and not retained afterwards. It is an explicit choice you make each time, and one you can explain to a candidate who asks what happens to the recording.

      ## What the workflow looks like

      You record an interview, and Sonabrief hands you a clean, structured written draft: you review it, finish it in your own words, and use it for your notes or the scorecard. You start from a ready text instead of a blank page, and the version that counts stays yours. The original audio is not stored as a file once transcribed, so a candidate's personal data is not left sitting in a third party cloud after the conversation is over.

      ## What it does not do, and what stays with you

      Sonabrief is a tool, not a data protection program. It does not decide whether an interview may be recorded, whether the candidate has consented, or what your obligations as a controller require. Those decisions remain yours and your organisation's. The software is open source, so your data protection advisor can inspect exactly how it handles audio rather than trusting a marketing claim.

      None of this is legal advice. It is a description of how the tool works, so you can decide whether it fits the way you are required, and have chosen, to work.
    faq:
      - q: "Is the interview audio uploaded to the cloud?"
        a: "It depends on the choice you make before each recording. If you select on-device transcription, the audio stays on your computer and is never uploaded. If you choose transcription on European servers for extra speed, the audio is processed in the EU and is not retained once transcribed."
      - q: "How does Sonabrief protect candidate data?"
        a: "On-device transcription keeps the recording off any third party server, which is the most protective option for a candidate's personal data. If you choose European cloud transcription, processing happens in the EU and nothing is retained afterwards. Whether and how to record an interview, and on what legal basis, remains your responsibility as a controller. This is not legal advice."
      - q: "What do I tell a candidate who asks how the recording is handled?"
        a: "You can tell them the truth, and show it: the audio is transcribed on your device and not uploaded, or processed on European servers that keep nothing afterwards, and it is never used to train any model. Because Sonabrief is open source, the claim can be verified rather than taken on trust."
      - q: "Will my interviews be used to train AI models?"
        a: "No. Your interviews are never used to train any model. When you ask for a written summary, it runs either on your own device or on European servers that keep nothing once the request is processed."
      - q: "Where is my data hosted?"
        a: "Sonabrief uses European infrastructure, and cloud summaries run on European servers that keep nothing once a request is processed. On-device transcription avoids the upload entirely if you prefer nothing to leave your machine."

  it:
    profession: "Per recruiter"
    painPoints:
      - "Le registrazioni dei colloqui contengono dati personali dei candidati e valutazioni riservate"
      - "Uno strumento cloud generico archivia quei dati all'estero, fuori dal tuo controllo"
      - "Tempo perso a verbalizzare i colloqui invece di parlare con le persone"
    title: "Sonabrief per recruiter: colloqui con i candidati trattati con cura"
    description: "Un assistente per i colloqui pensato per la protezione dei dati dei candidati. Prima di ogni registrazione scegli tu se l'audio viene trascritto sul tuo dispositivo o su server europei. La registrazione non viene mai conservata come file."
    intro: |
      La registrazione di un colloquio è un file denso di dati personali di una persona: la sua storia, la sua situazione attuale, a volte cose che ti direbbe solo in confidenza, più la valutazione schietta che ne segue. Per la normativa sulla protezione dei dati il candidato ha diritti su tutto questo, e non ha acconsentito a che la sua voce venga elaborata su server all'estero o riutilizzata per migliorare il modello di qualcuno. La maggior parte degli strumenti di trascrizione generici fa esattamente questo. Per un recruiter che dipende dalla fiducia dei candidati nel processo, è una responsabilità silenziosa sullo sfondo di ogni conversazione.

      Sonabrief parte da un presupposto diverso. Prima di ogni registrazione decidi tu come viene gestito l'audio. Puoi trascrivere interamente **sul tuo dispositivo**, così la registrazione non viene caricata da nessuna parte. Oppure puoi scegliere di trascrivere su **server europei** quando ti serve più velocità, e in quel caso l'audio viene elaborato nell'Unione Europea e non conservato in seguito. È una scelta esplicita che fai ogni volta, e che puoi spiegare a un candidato che ti chiede cosa succede alla registrazione.

      ## Come funziona, in pratica

      Registri un colloquio, e Sonabrief ti consegna una bozza scritta pulita e strutturata: tu la rivedi, la chiudi con parole tue, e la usi per le tue note o per la scorecard. Parti da un testo già pronto invece che dal foglio bianco, e la versione che conta resta la tua. L'audio originale non viene salvato come file una volta trascritto, quindi i dati personali di un candidato non restano depositati in un cloud di terzi dopo la fine della conversazione.

      ## Cosa non fa, e cosa resta in capo a te

      Sonabrief è uno strumento, non un programma di protezione dei dati. Non decide se un colloquio possa essere registrato, se il candidato ha prestato il consenso, o cosa richiedono i tuoi obblighi di titolare del trattamento. Queste decisioni restano tue e della tua organizzazione. Il software è open source, quindi il tuo consulente per la protezione dei dati può ispezionare esattamente come tratta l'audio invece di fidarsi di un'affermazione di marketing.

      Nulla di tutto questo costituisce consulenza legale. È una descrizione di come funziona lo strumento, perché tu possa decidere se è adatto al modo in cui sei tenuto, e hai scelto, di lavorare.
    faq:
      - q: "L'audio del colloquio viene caricato nel cloud?"
        a: "Dipende dalla scelta che fai prima di ogni registrazione. Se selezioni la trascrizione sul dispositivo, l'audio resta sul tuo computer e non viene mai caricato. Se scegli la trascrizione su server europei per avere più velocità, l'audio viene elaborato nell'Unione Europea e non viene conservato una volta trascritto."
      - q: "Come protegge Sonabrief i dati dei candidati?"
        a: "La trascrizione sul dispositivo tiene la registrazione fuori da qualsiasi server di terzi, che è l'opzione più protettiva per i dati personali di un candidato. Se scegli la trascrizione cloud europea, l'elaborazione avviene nell'Unione Europea e nulla viene conservato in seguito. Se e come registrare un colloquio, e su quale base giuridica, resta una tua responsabilità di titolare del trattamento. Questa non è consulenza legale."
      - q: "Cosa dico a un candidato che chiede come viene gestita la registrazione?"
        a: "Puoi dirgli la verità, e mostrarla: l'audio viene trascritto sul tuo dispositivo e non caricato, oppure elaborato su server europei che non conservano nulla in seguito, e non viene mai usato per addestrare alcun modello. Poiché Sonabrief è open source, l'affermazione può essere verificata invece che presa sulla fiducia."
      - q: "I miei colloqui verranno usati per addestrare modelli AI?"
        a: "No. I tuoi colloqui non vengono mai usati per addestrare alcun modello. Quando chiedi un riepilogo scritto, viene elaborato sul tuo dispositivo oppure su server europei che non conservano nulla una volta elaborata la richiesta."
      - q: "Dove vengono ospitati i miei dati?"
        a: "Sonabrief usa infrastruttura europea, e le sintesi cloud girano su server europei che non conservano nulla una volta elaborata la richiesta. La trascrizione sul dispositivo evita del tutto il caricamento, se preferisci che nulla lasci la tua macchina."

  fr:
    profession: "Pour les recruteurs"
    painPoints:
      - "Les enregistrements d'entretiens contiennent les données personnelles des candidats et des appréciations franches"
      - "Un outil cloud générique stocke ces données à l'étranger, hors de votre contrôle"
      - "Du temps perdu à rédiger les entretiens au lieu de parler aux gens"
    title: "Sonabrief pour les recruteurs : des entretiens de candidats traités avec soin"
    description: "Un assistant d'entretien pensé pour la protection des données des candidats. Avant chaque enregistrement, vous choisissez si l'audio est transcrit sur votre propre appareil ou sur des serveurs européens. L'enregistrement n'est jamais conservé sous forme de fichier."
    intro: |
      L'enregistrement d'un entretien est un fichier dense de données personnelles : le parcours d'une personne, sa situation actuelle, parfois des choses qu'elle ne vous confierait qu'en confidence, ainsi que l'appréciation franche qui suit. En vertu du droit de la protection des données, le candidat a des droits sur l'ensemble de ces éléments, et il n'a pas accepté que sa voix soit traitée sur des serveurs à l'étranger ni réutilisée pour améliorer le modèle de quelqu'un. La plupart des outils de transcription génériques font exactement cela. Pour un recruteur qui dépend de la confiance des candidats dans le processus, c'est un risque silencieux présent en arrière-plan de chaque échange.

      Sonabrief part d'un présupposé différent. Avant chaque enregistrement, vous décidez de la manière dont l'audio est traité. Vous pouvez transcrire entièrement **sur votre propre appareil**, et l'enregistrement n'est alors téléversé nulle part. Ou vous pouvez choisir de transcrire sur **des serveurs européens** lorsque vous avez besoin de plus de rapidité : l'audio est alors traité dans l'Union européenne et n'est pas conservé ensuite. C'est un choix explicite que vous faites à chaque fois, et que vous pouvez expliquer à un candidat qui demande ce qu'il advient de l'enregistrement.

      ## Comment cela se passe en pratique

      Vous enregistrez un entretien, et Sonabrief vous remet un brouillon écrit propre et structuré : vous le relisez, vous le finalisez avec vos propres mots, et vous l'utilisez pour vos notes ou la grille d'évaluation. Vous partez d'un texte prêt plutôt que d'une page blanche, et la version qui compte reste la vôtre. L'audio d'origine n'est pas conservé sous forme de fichier une fois transcrit, de sorte que les données personnelles d'un candidat ne restent pas dans le cloud d'un tiers une fois l'échange terminé.

      ## Ce que l'outil ne fait pas, et ce qui reste de votre ressort

      Sonabrief est un outil, pas un programme de protection des données. Il ne décide pas si un entretien peut être enregistré, si le candidat a consenti, ou ce qu'exigent vos obligations en tant que responsable du traitement. Ces décisions restent les vôtres et celles de votre organisation. Le logiciel est open source : votre conseil en protection des données peut donc inspecter exactement comment l'audio est traité, plutôt que de se fier à une promesse marketing.

      Rien de tout cela ne constitue un conseil juridique. C'est une description du fonctionnement de l'outil, pour que vous puissiez décider s'il convient à la manière dont vous êtes tenu, et avez choisi, de travailler.
    faq:
      - q: "L'audio de l'entretien est-il téléversé dans le cloud ?"
        a: "Cela dépend du choix que vous faites avant chaque enregistrement. Si vous optez pour la transcription sur l'appareil, l'audio reste sur votre ordinateur et n'est jamais téléversé. Si vous choisissez la transcription sur des serveurs européens pour plus de rapidité, l'audio est traité dans l'Union européenne et n'est pas conservé une fois transcrit."
      - q: "Comment Sonabrief protège-t-il les données des candidats ?"
        a: "La transcription sur l'appareil garde l'enregistrement hors de tout serveur tiers, ce qui est l'option la plus protectrice pour les données personnelles d'un candidat. Si vous choisissez la transcription sur le cloud européen, le traitement a lieu dans l'Union européenne et rien n'est conservé ensuite. Savoir si et comment enregistrer un entretien, et sur quelle base légale, reste votre responsabilité en tant que responsable du traitement. Ceci n'est pas un conseil juridique."
      - q: "Que dire à un candidat qui demande comment l'enregistrement est traité ?"
        a: "Vous pouvez lui dire la vérité, et la montrer : l'audio est transcrit sur votre appareil et non téléversé, ou traité sur des serveurs européens qui ne conservent rien ensuite, et il ne sert jamais à entraîner un quelconque modèle. Comme Sonabrief est open source, l'affirmation peut être vérifiée plutôt que prise sur parole."
      - q: "Mes entretiens serviront-ils à entraîner des modèles d'IA ?"
        a: "Non. Vos entretiens ne servent jamais à entraîner un quelconque modèle. Lorsque vous demandez une synthèse écrite, elle est traitée soit sur votre propre appareil, soit sur des serveurs européens qui ne conservent rien une fois la requête traitée."
      - q: "Où mes données sont-elles hébergées ?"
        a: "Sonabrief utilise une infrastructure européenne, et les synthèses dans le cloud tournent sur des serveurs européens qui ne conservent rien une fois la requête traitée. La transcription sur l'appareil évite tout téléversement si vous préférez que rien ne quitte votre machine."

  es:
    profession: "Para reclutadores"
    painPoints:
      - "Las grabaciones de entrevistas contienen datos personales de los candidatos y valoraciones francas"
      - "Una herramienta cloud genérica almacena esos datos en el extranjero, fuera de tu control"
      - "Tiempo perdido redactando las entrevistas en lugar de hablar con las personas"
    title: "Sonabrief para reclutadores: entrevistas de candidatos tratadas con cuidado"
    description: "Un asistente de entrevistas pensado para la protección de los datos de los candidatos. Antes de cada grabación, eliges si el audio se transcribe en tu propio dispositivo o en servidores europeos. La grabación nunca se conserva como archivo."
    intro: |
      La grabación de una entrevista es un archivo denso de datos personales de una persona: su trayectoria, su situación actual, a veces cosas que solo te contaría en confianza, más la valoración franca que viene después. Conforme al derecho de protección de datos, el candidato tiene derechos sobre todo ello, y no ha consentido que su voz se procese en servidores en el extranjero ni se reutilice para mejorar el modelo de alguien. La mayoría de las herramientas de transcripción genéricas hacen exactamente eso. Para un reclutador que depende de la confianza de los candidatos en el proceso, es un riesgo silencioso de fondo en cada conversación.

      Sonabrief parte de un planteamiento distinto. Antes de cada grabación decides cómo se trata el audio. Puedes transcribir por completo **en tu propio dispositivo**, de modo que la grabación no se sube a ninguna parte. O puedes optar por transcribir en **servidores europeos** cuando necesites más rapidez: en ese caso el audio se procesa en la Unión Europea y no se conserva después. Es una decisión explícita que tomas cada vez, y que puedes explicar a un candidato que pregunte qué ocurre con la grabación.

      ## Cómo funciona en la práctica

      Grabas una entrevista, y Sonabrief te entrega un borrador escrito limpio y estructurado: lo revisas, lo cierras con tus propias palabras y lo usas para tus notas o para la plantilla de evaluación. Partes de un texto listo en lugar de una página en blanco, y la versión que cuenta sigue siendo tuya. El audio original no se guarda como archivo una vez transcrito, así que los datos personales de un candidato no quedan alojados en una nube de terceros una vez terminada la conversación.

      ## Lo que no hace, y lo que sigue siendo tuyo

      Sonabrief es una herramienta, no un programa de protección de datos. No decide si una entrevista puede grabarse, si el candidato ha consentido, o qué exigen tus obligaciones como responsable del tratamiento. Esas decisiones siguen siendo tuyas y de tu organización. El software es de código abierto, así que tu asesor de protección de datos puede inspeccionar exactamente cómo trata el audio, en lugar de fiarse de una afirmación de marketing.

      Nada de esto constituye asesoramiento jurídico. Es una descripción de cómo funciona la herramienta, para que decidas si encaja con la forma en que estás obligado, y has elegido, a trabajar.
    faq:
      - q: "¿Se sube al cloud el audio de la entrevista?"
        a: "Depende de la opción que elijas antes de cada grabación. Si seleccionas la transcripción en el dispositivo, el audio permanece en tu ordenador y nunca se sube. Si eliges la transcripción en servidores europeos para mayor rapidez, el audio se procesa en la Unión Europea y no se conserva una vez transcrito."
      - q: "¿Cómo protege Sonabrief los datos de los candidatos?"
        a: "La transcripción en el dispositivo mantiene la grabación fuera de cualquier servidor de terceros, que es la opción más protectora para los datos personales de un candidato. Si eliges la transcripción en el cloud europeo, el procesamiento ocurre en la Unión Europea y no se conserva nada después. Si grabar una entrevista, y cómo, y sobre qué base jurídica, sigue siendo tu responsabilidad como responsable del tratamiento. Esto no es asesoramiento jurídico."
      - q: "¿Qué le digo a un candidato que pregunta cómo se trata la grabación?"
        a: "Puedes decirle la verdad, y mostrarla: el audio se transcribe en tu dispositivo y no se sube, o se procesa en servidores europeos que no conservan nada después, y nunca se usa para entrenar ningún modelo. Como Sonabrief es de código abierto, la afirmación puede verificarse en lugar de tomarse por buena."
      - q: "¿Se usarán mis entrevistas para entrenar modelos de IA?"
        a: "No. Tus entrevistas nunca se usan para entrenar ningún modelo. Cuando pides un resumen escrito, se procesa en tu propio dispositivo o en servidores europeos que no conservan nada una vez procesada la petición."
      - q: "¿Dónde se alojan mis datos?"
        a: "Sonabrief usa infraestructura europea, y los resúmenes en la nube se ejecutan en servidores europeos que no conservan nada una vez procesada la petición. La transcripción en el dispositivo evita por completo la subida si prefieres que nada salga de tu máquina."

  de:
    profession: "Für Recruiter"
    painPoints:
      - "Interviewaufnahmen enthalten personenbezogene Daten der Bewerber und offene Einschätzungen"
      - "Ein allgemeines Cloud-Werkzeug speichert diese Daten im Ausland, außerhalb Ihrer Kontrolle"
      - "Verlorene Zeit für das Verfassen von Interviews statt für das Gespräch mit Menschen"
    title: "Sonabrief für Recruiter: Bewerbungsgespräche, mit Sorgfalt behandelt"
    description: "Ein Gesprächsassistent, der auf den Schutz von Bewerberdaten ausgelegt ist. Vor jeder Aufnahme entscheiden Sie, ob das Audio auf Ihrem eigenen Gerät oder auf europäischen Servern transkribiert wird. Die Aufnahme wird nie als Datei gespeichert."
    intro: |
      Die Aufnahme eines Bewerbungsgesprächs ist eine dichte Datei mit personenbezogenen Daten eines Menschen: sein Werdegang, seine aktuelle Lage, mitunter Dinge, die er Ihnen nur im Vertrauen sagen würde, sowie die offene Einschätzung, die folgt. Nach dem Datenschutzrecht hat ein Bewerber Rechte an all dem, und er hat nicht zugestimmt, dass seine Stimme auf Servern im Ausland verarbeitet oder zur Verbesserung des Modells eines anderen erneut verwendet wird. Die meisten allgemeinen Transkriptionswerkzeuge tun genau das. Für einen Recruiter, der auf das Vertrauen der Bewerber in den Prozess angewiesen ist, ist das ein stilles Risiko im Hintergrund jedes Gesprächs.

      Sonabrief geht von einer anderen Grundannahme aus. Vor jeder Aufnahme entscheiden Sie, wie das Audio behandelt wird. Sie können vollständig **auf Ihrem eigenen Gerät** transkribieren, sodass die Aufnahme nirgendwo hochgeladen wird. Oder Sie wählen die Transkription auf **europäischen Servern**, wenn Sie mehr Geschwindigkeit brauchen: Dann wird das Audio in der EU verarbeitet und danach nicht aufbewahrt. Es ist eine bewusste Entscheidung, die Sie jedes Mal treffen, und die Sie einem Bewerber erklären können, der fragt, was mit der Aufnahme geschieht.

      ## So sieht der Ablauf aus

      Sie nehmen ein Gespräch auf, und Sonabrief übergibt Ihnen einen sauberen, strukturierten schriftlichen Entwurf: Sie prüfen ihn, vollenden ihn mit Ihren eigenen Worten und nutzen ihn für Ihre Notizen oder den Bewertungsbogen. Sie beginnen mit einem fertigen Text statt mit einem leeren Blatt, und die Fassung, die zählt, bleibt Ihre. Das ursprüngliche Audio wird nach der Transkription nicht als Datei gespeichert, sodass die personenbezogenen Daten eines Bewerbers nach dem Gespräch nicht in der Cloud eines Dritten zurückbleiben.

      ## Was das Werkzeug nicht tut, und was bei Ihnen bleibt

      Sonabrief ist ein Werkzeug, kein Datenschutzprogramm. Es entscheidet nicht, ob ein Gespräch aufgenommen werden darf, ob der Bewerber eingewilligt hat oder was Ihre Pflichten als Verantwortlicher verlangen. Diese Entscheidungen bleiben Ihre und die Ihrer Organisation. Die Software ist quelloffen, sodass Ihr Datenschutzberater genau prüfen kann, wie das Audio verarbeitet wird, statt sich auf ein Marketingversprechen zu verlassen.

      Nichts davon ist eine Rechtsberatung. Es ist eine Beschreibung der Funktionsweise des Werkzeugs, damit Sie entscheiden können, ob es zu der Arbeitsweise passt, zu der Sie verpflichtet sind und für die Sie sich entschieden haben.
    faq:
      - q: "Wird das Audio des Gesprächs in die Cloud hochgeladen?"
        a: "Das hängt von der Entscheidung ab, die Sie vor jeder Aufnahme treffen. Wenn Sie die Transkription auf dem Gerät wählen, bleibt das Audio auf Ihrem Computer und wird nie hochgeladen. Wenn Sie für mehr Geschwindigkeit die Transkription auf europäischen Servern wählen, wird das Audio in der EU verarbeitet und nach der Transkription nicht aufbewahrt."
      - q: "Wie schützt Sonabrief Bewerberdaten?"
        a: "Die Transkription auf dem Gerät hält die Aufnahme von jedem Server Dritter fern, was die schützendste Option für die personenbezogenen Daten eines Bewerbers ist. Wenn Sie die Transkription in der europäischen Cloud wählen, findet die Verarbeitung in der EU statt und danach wird nichts aufbewahrt. Ob und wie ein Gespräch aufgenommen wird und auf welcher Rechtsgrundlage, bleibt Ihre Verantwortung als Verantwortlicher. Dies ist keine Rechtsberatung."
      - q: "Was sage ich einem Bewerber, der fragt, wie die Aufnahme behandelt wird?"
        a: "Sie können ihm die Wahrheit sagen und sie zeigen: Das Audio wird auf Ihrem Gerät transkribiert und nicht hochgeladen, oder auf europäischen Servern verarbeitet, die danach nichts aufbewahren, und es wird nie zum Trainieren irgendeines Modells verwendet. Da Sonabrief quelloffen ist, lässt sich die Angabe überprüfen, statt sie auf Treu und Glauben hinzunehmen."
      - q: "Werden meine Interviews zum Trainieren von KI-Modellen verwendet?"
        a: "Nein. Ihre Interviews werden nie zum Trainieren irgendeines Modells verwendet. Wenn Sie eine schriftliche Zusammenfassung anfordern, läuft sie entweder auf Ihrem eigenen Gerät oder auf europäischen Servern, die nach der Verarbeitung der Anfrage nichts aufbewahren."
      - q: "Wo werden meine Daten gehostet?"
        a: "Sonabrief nutzt europäische Infrastruktur, und Cloud-Zusammenfassungen laufen auf europäischen Servern, die nach der Verarbeitung einer Anfrage nichts aufbewahren. Die Transkription auf dem Gerät vermeidet das Hochladen vollständig, wenn Sie lieber möchten, dass nichts Ihre Maschine verlässt."
