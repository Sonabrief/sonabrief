i18n:
  en:
    profession: "For financial analysts"
    painPoints:
      - "Meetings and calls can contain price-sensitive, non-public information"
      - "Regulators expect that flow of information to be controlled, not sitting in an uncontrolled channel"
      - "Time lost writing up calls instead of analysing"
    title: "Sonabrief for financial analysts: keep price-sensitive information controlled"
    description: "A meeting assistant for analysts built around controlled handling of sensitive information. You choose, before each recording, whether the audio is transcribed on your own device or on European servers. The recording is never kept as a file."
    intro: |
      An analyst's meetings and calls can contain information that has not been made public and would move a price if it were: a management call, an expert network session, an internal discussion of a position. Under the Market Abuse Regulation, inside information is precisely this kind of non-public, price-sensitive material, and firms are expected to keep its flow controlled rather than scattered across uncontrolled channels. A recording of such a conversation is the most complete copy of it. Most general purpose transcription tools treat that recording as ordinary content to upload, process on servers abroad, and in several cases reuse to improve their models, which is exactly the uncontrolled channel a compliance function is trying to close.

      Sonabrief starts from a different assumption. Before each recording you decide how the audio is handled. You can transcribe entirely **on your own device**, so the recording is never uploaded anywhere and stays inside your controlled environment. Or you can choose to transcribe on **European servers** when you need more speed, in which case the audio is processed in the EU and not retained afterwards. It is an explicit choice you make each time.

      ## What the workflow looks like

      You record a call or a meeting, and Sonabrief hands you a clean, structured written draft: you review it, finish it in your own words, and use it for your notes. You start from a ready text instead of a blank page, and the version that counts stays yours. The original audio is not stored as a file once transcribed, so a conversation that may carry inside information does not end up on a third party's server outside your firm's control.

      ## What it does not do, and what stays with you

      Sonabrief is a tool, not a compliance program. It does not decide whether a call may be recorded, whether a conversation carries inside information, or what your firm's policies and the applicable market-abuse rules require. Those judgements remain yours and your compliance function's. The software is open source, so your compliance or security team can inspect exactly how it handles audio rather than trusting a marketing claim.

      None of this is legal or compliance advice. It is a description of how the tool works, so you can decide whether it fits the way you are required, and have chosen, to work.
    faq:
      - q: "Is the call audio uploaded to the cloud?"
        a: "It depends on the choice you make before each recording. If you select on-device transcription, the audio stays on your computer and is never uploaded. If you choose transcription on European servers for extra speed, the audio is processed in the EU and is not retained once transcribed."
      - q: "How does this help with controlling sensitive information?"
        a: "On-device transcription keeps the recording inside your controlled environment, off any third party server, which is the right posture when a conversation may carry price-sensitive or inside information. If you choose European cloud transcription, processing happens in the EU and nothing is retained afterwards. What your market-abuse obligations require remains your firm's responsibility. This is not compliance advice."
      - q: "Can my compliance team verify these claims?"
        a: "Yes. Sonabrief is open source, so the code that handles audio can be inspected directly rather than relying on a promise. Your compliance or security team can review how recording, transcription and storage actually behave."
      - q: "Will my calls be used to train AI models?"
        a: "No. Your calls are never used to train any model. When you ask for a written summary, it runs either on your own device or on European servers that keep nothing once the request is processed."
      - q: "Where is my data hosted?"
        a: "Sonabrief uses European infrastructure, and cloud summaries run on European servers that keep nothing once a request is processed. On-device transcription avoids the upload entirely if you prefer nothing to leave your machine."

  it:
    profession: "Per analisti finanziari"
    painPoints:
      - "Riunioni e call possono contenere informazioni price-sensitive non pubbliche"
      - "La vigilanza si aspetta che quel flusso di informazioni sia controllato, non lasciato in un canale non controllato"
      - "Tempo perso a verbalizzare le call invece di analizzare"
    title: "Sonabrief per analisti finanziari: tieni controllate le informazioni price-sensitive"
    description: "Un assistente per le riunioni pensato per la gestione controllata delle informazioni sensibili. Prima di ogni registrazione scegli tu se l'audio viene trascritto sul tuo dispositivo o su server europei. La registrazione non viene mai conservata come file."
    intro: |
      Le riunioni e le call di un analista possono contenere informazioni non rese pubbliche che muoverebbero un prezzo se lo fossero: una call con il management, una sessione di expert network, una discussione interna su una posizione. Secondo il Market Abuse Regulation, l'informazione privilegiata è esattamente questo tipo di materiale non pubblico e price-sensitive, e le società sono tenute a mantenerne controllato il flusso invece di disperderlo in canali non controllati. La registrazione di una conversazione del genere ne è la copia più completa. La maggior parte degli strumenti di trascrizione generici tratta quella registrazione come un contenuto qualsiasi da caricare, elaborare su server all'estero e, in diversi casi, riutilizzare per migliorare i propri modelli, che è esattamente il canale non controllato che una funzione compliance cerca di chiudere.

      Sonabrief parte da un presupposto diverso. Prima di ogni registrazione decidi tu come viene gestito l'audio. Puoi trascrivere interamente **sul tuo dispositivo**, così la registrazione non viene caricata da nessuna parte e resta dentro il tuo ambiente controllato. Oppure puoi scegliere di trascrivere su **server europei** quando ti serve più velocità, e in quel caso l'audio viene elaborato nell'Unione Europea e non conservato in seguito. È una scelta esplicita che fai ogni volta.

      ## Come funziona, in pratica

      Registri una call o una riunione, e Sonabrief ti consegna una bozza scritta pulita e strutturata: tu la rivedi, la chiudi con parole tue, e la usi per le tue note. Parti da un testo già pronto invece che dal foglio bianco, e la versione che conta resta la tua. L'audio originale non viene salvato come file una volta trascritto, quindi una conversazione che potrebbe contenere informazioni privilegiate non finisce sul server di terzi fuori dal controllo della tua società.

      ## Cosa non fa, e cosa resta in capo a te

      Sonabrief è uno strumento, non un programma di conformità. Non decide se una call possa essere registrata, se una conversazione contiene informazioni privilegiate, o cosa richiedono le policy della tua società e le regole applicabili sul market abuse. Queste valutazioni restano tue e della tua funzione compliance. Il software è open source, quindi il tuo team compliance o di sicurezza può ispezionare esattamente come tratta l'audio invece di fidarsi di un'affermazione di marketing.

      Nulla di tutto questo costituisce consulenza legale o di compliance. È una descrizione di come funziona lo strumento, perché tu possa decidere se è adatto al modo in cui sei tenuto, e hai scelto, di lavorare.
    faq:
      - q: "L'audio della call viene caricato nel cloud?"
        a: "Dipende dalla scelta che fai prima di ogni registrazione. Se selezioni la trascrizione sul dispositivo, l'audio resta sul tuo computer e non viene mai caricato. Se scegli la trascrizione su server europei per avere più velocità, l'audio viene elaborato nell'Unione Europea e non viene conservato una volta trascritto."
      - q: "Come aiuta a tenere controllate le informazioni sensibili?"
        a: "La trascrizione sul dispositivo tiene la registrazione dentro il tuo ambiente controllato, fuori da qualsiasi server di terzi, che è la postura giusta quando una conversazione può contenere informazioni price-sensitive o privilegiate. Se scegli la trascrizione cloud europea, l'elaborazione avviene nell'Unione Europea e nulla viene conservato in seguito. Cosa richiedono i tuoi obblighi sul market abuse resta una responsabilità della tua società. Questa non è consulenza di compliance."
      - q: "Il mio team compliance può verificare queste affermazioni?"
        a: "Sì. Sonabrief è open source, quindi il codice che gestisce l'audio può essere ispezionato direttamente invece di affidarsi a una promessa. Il tuo team compliance o di sicurezza può verificare come si comportano davvero la registrazione, la trascrizione e l'archiviazione."
      - q: "Le mie call verranno usate per addestrare modelli AI?"
        a: "No. Le tue call non vengono mai usate per addestrare alcun modello. Quando chiedi un riepilogo scritto, viene elaborato sul tuo dispositivo oppure su server europei che non conservano nulla una volta elaborata la richiesta."
      - q: "Dove vengono ospitati i miei dati?"
        a: "Sonabrief usa infrastruttura europea, e le sintesi cloud girano su server europei che non conservano nulla una volta elaborata la richiesta. La trascrizione sul dispositivo evita del tutto il caricamento, se preferisci che nulla lasci la tua macchina."

  fr:
    profession: "Pour les analystes financiers"
    painPoints:
      - "Les réunions et les appels peuvent contenir des informations non publiques et sensibles sur les cours"
      - "Les régulateurs attendent que ce flux d'informations soit maîtrisé, et non laissé dans un canal non contrôlé"
      - "Du temps perdu à rédiger les appels au lieu d'analyser"
    title: "Sonabrief pour les analystes financiers : gardez la maîtrise des informations sensibles sur les cours"
    description: "Un assistant de réunion pensé pour un traitement maîtrisé des informations sensibles. Avant chaque enregistrement, vous choisissez si l'audio est transcrit sur votre propre appareil ou sur des serveurs européens. L'enregistrement n'est jamais conservé sous forme de fichier."
    intro: |
      Les réunions et les appels d'un analyste peuvent contenir des informations qui n'ont pas été rendues publiques et qui feraient bouger un cours si elles l'étaient : un appel avec la direction, une session d'expert network, une discussion interne sur une position. En vertu du règlement sur les abus de marché (MAR), l'information privilégiée est précisément ce type d'élément non public et sensible pour les cours, et les sociétés sont tenues d'en maîtriser le flux plutôt que de le disperser dans des canaux non contrôlés. L'enregistrement d'une telle conversation en est la copie la plus complète. La plupart des outils de transcription génériques traitent cet enregistrement comme un contenu ordinaire : ils le téléversent, le traitent sur des serveurs à l'étranger et, dans plusieurs cas, le réutilisent pour améliorer leurs modèles, ce qui est exactement le canal non contrôlé qu'une fonction conformité cherche à fermer.

      Sonabrief part d'un présupposé différent. Avant chaque enregistrement, vous décidez de la manière dont l'audio est traité. Vous pouvez transcrire entièrement **sur votre propre appareil**, et l'enregistrement n'est alors téléversé nulle part et reste dans votre environnement maîtrisé. Ou vous pouvez choisir de transcrire sur **des serveurs européens** lorsque vous avez besoin de plus de rapidité : l'audio est alors traité dans l'Union européenne et n'est pas conservé ensuite. C'est un choix explicite que vous faites à chaque fois.

      ## Comment cela se passe en pratique

      Vous enregistrez un appel ou une réunion, et Sonabrief vous remet un brouillon écrit propre et structuré : vous le relisez, vous le finalisez avec vos propres mots, et vous l'utilisez pour vos notes. Vous partez d'un texte prêt plutôt que d'une page blanche, et la version qui compte reste la vôtre. L'audio d'origine n'est pas conservé sous forme de fichier une fois transcrit, de sorte qu'une conversation pouvant contenir une information privilégiée ne se retrouve pas sur le serveur d'un tiers, hors du contrôle de votre société.

      ## Ce que l'outil ne fait pas, et ce qui reste de votre ressort

      Sonabrief est un outil, pas un programme de conformité. Il ne décide pas si un appel peut être enregistré, si une conversation contient une information privilégiée, ou ce qu'exigent les politiques de votre société et les règles applicables sur les abus de marché. Ces appréciations restent les vôtres et celles de votre fonction conformité. Le logiciel est open source : votre équipe conformité ou sécurité peut donc inspecter exactement comment l'audio est traité, plutôt que de se fier à une promesse marketing.

      Rien de tout cela ne constitue un conseil juridique ou de conformité. C'est une description du fonctionnement de l'outil, pour que vous puissiez décider s'il convient à la manière dont vous êtes tenu, et avez choisi, de travailler.
    faq:
      - q: "L'audio de l'appel est-il téléversé dans le cloud ?"
        a: "Cela dépend du choix que vous faites avant chaque enregistrement. Si vous optez pour la transcription sur l'appareil, l'audio reste sur votre ordinateur et n'est jamais téléversé. Si vous choisissez la transcription sur des serveurs européens pour plus de rapidité, l'audio est traité dans l'Union européenne et n'est pas conservé une fois transcrit."
      - q: "En quoi cela aide-t-il à maîtriser les informations sensibles ?"
        a: "La transcription sur l'appareil garde l'enregistrement dans votre environnement maîtrisé, hors de tout serveur tiers, ce qui est la bonne posture lorsqu'une conversation peut contenir une information sensible pour les cours ou privilégiée. Si vous choisissez la transcription sur le cloud européen, le traitement a lieu dans l'Union européenne et rien n'est conservé ensuite. Ce qu'exigent vos obligations en matière d'abus de marché reste la responsabilité de votre société. Ceci n'est pas un conseil de conformité."
      - q: "Mon équipe conformité peut-elle vérifier ces affirmations ?"
        a: "Oui. Sonabrief est open source : le code qui traite l'audio peut donc être inspecté directement, sans avoir à se fier à une promesse. Votre équipe conformité ou sécurité peut vérifier comment se comportent réellement l'enregistrement, la transcription et le stockage."
      - q: "Mes appels serviront-ils à entraîner des modèles d'IA ?"
        a: "Non. Vos appels ne servent jamais à entraîner un quelconque modèle. Lorsque vous demandez une synthèse écrite, elle est traitée soit sur votre propre appareil, soit sur des serveurs européens qui ne conservent rien une fois la requête traitée."
      - q: "Où mes données sont-elles hébergées ?"
        a: "Sonabrief utilise une infrastructure européenne, et les synthèses dans le cloud tournent sur des serveurs européens qui ne conservent rien une fois la requête traitée. La transcription sur l'appareil évite tout téléversement si vous préférez que rien ne quitte votre machine."

  es:
    profession: "Para analistas financieros"
    painPoints:
      - "Las reuniones y las llamadas pueden contener información no pública y sensible para la cotización"
      - "Los reguladores esperan que ese flujo de información esté controlado, no en un canal sin control"
      - "Tiempo perdido redactando las llamadas en lugar de analizar"
    title: "Sonabrief para analistas financieros: mantén controlada la información sensible para la cotización"
    description: "Un asistente de reuniones pensado para un tratamiento controlado de la información sensible. Antes de cada grabación, eliges si el audio se transcribe en tu propio dispositivo o en servidores europeos. La grabación nunca se conserva como archivo."
    intro: |
      Las reuniones y las llamadas de un analista pueden contener información que no se ha hecho pública y que movería una cotización si lo fuera: una llamada con la dirección, una sesión de expert network, una discusión interna sobre una posición. Conforme al Reglamento sobre Abuso de Mercado (MAR), la información privilegiada es precisamente este tipo de material no público y sensible para la cotización, y se espera que las entidades mantengan controlado su flujo en lugar de dispersarlo por canales sin control. La grabación de una conversación así es su copia más completa. La mayoría de las herramientas de transcripción genéricas tratan esa grabación como contenido cualquiera: la suben, la procesan en servidores en el extranjero y, en varios casos, la reutilizan para mejorar sus modelos, que es exactamente el canal sin control que una función de cumplimiento trata de cerrar.

      Sonabrief parte de un planteamiento distinto. Antes de cada grabación decides cómo se trata el audio. Puedes transcribir por completo **en tu propio dispositivo**, de modo que la grabación no se sube a ninguna parte y permanece dentro de tu entorno controlado. O puedes optar por transcribir en **servidores europeos** cuando necesites más rapidez: en ese caso el audio se procesa en la Unión Europea y no se conserva después. Es una decisión explícita que tomas cada vez.

      ## Cómo funciona en la práctica

      Grabas una llamada o una reunión, y Sonabrief te entrega un borrador escrito limpio y estructurado: lo revisas, lo cierras con tus propias palabras y lo usas para tus notas. Partes de un texto listo en lugar de una página en blanco, y la versión que cuenta sigue siendo tuya. El audio original no se guarda como archivo una vez transcrito, así que una conversación que pueda contener información privilegiada no acaba en el servidor de un tercero, fuera del control de tu entidad.

      ## Lo que no hace, y lo que sigue siendo tuyo

      Sonabrief es una herramienta, no un programa de cumplimiento. No decide si una llamada puede grabarse, si una conversación contiene información privilegiada, o qué exigen las políticas de tu entidad y las normas aplicables sobre abuso de mercado. Esas valoraciones siguen siendo tuyas y de tu función de cumplimiento. El software es de código abierto, así que tu equipo de cumplimiento o de seguridad puede inspeccionar exactamente cómo trata el audio, en lugar de fiarse de una afirmación de marketing.

      Nada de esto constituye asesoramiento jurídico ni de cumplimiento. Es una descripción de cómo funciona la herramienta, para que decidas si encaja con la forma en que estás obligado, y has elegido, a trabajar.
    faq:
      - q: "¿Se sube al cloud el audio de la llamada?"
        a: "Depende de la opción que elijas antes de cada grabación. Si seleccionas la transcripción en el dispositivo, el audio permanece en tu ordenador y nunca se sube. Si eliges la transcripción en servidores europeos para mayor rapidez, el audio se procesa en la Unión Europea y no se conserva una vez transcrito."
      - q: "¿Cómo ayuda a mantener controlada la información sensible?"
        a: "La transcripción en el dispositivo mantiene la grabación dentro de tu entorno controlado, fuera de cualquier servidor de terceros, que es la postura adecuada cuando una conversación puede contener información sensible para la cotización o privilegiada. Si eliges la transcripción en el cloud europeo, el procesamiento ocurre en la Unión Europea y no se conserva nada después. Lo que exigen tus obligaciones sobre abuso de mercado sigue siendo responsabilidad de tu entidad. Esto no es asesoramiento de cumplimiento."
      - q: "¿Puede mi equipo de cumplimiento verificar estas afirmaciones?"
        a: "Sí. Sonabrief es de código abierto, así que el código que trata el audio puede inspeccionarse directamente, sin tener que fiarse de una promesa. Tu equipo de cumplimiento o de seguridad puede comprobar cómo se comportan realmente la grabación, la transcripción y el almacenamiento."
      - q: "¿Se usarán mis llamadas para entrenar modelos de IA?"
        a: "No. Tus llamadas nunca se usan para entrenar ningún modelo. Cuando pides un resumen escrito, se procesa en tu propio dispositivo o en servidores europeos que no conservan nada una vez procesada la petición."
      - q: "¿Dónde se alojan mis datos?"
        a: "Sonabrief usa infraestructura europea, y los resúmenes en la nube se ejecutan en servidores europeos que no conservan nada una vez procesada la petición. La transcripción en el dispositivo evita por completo la subida si prefieres que nada salga de tu máquina."

  de:
    profession: "Für Finanzanalysten"
    painPoints:
      - "Besprechungen und Telefonate können nicht öffentliche, kursrelevante Informationen enthalten"
      - "Aufsichtsbehörden erwarten, dass dieser Informationsfluss kontrolliert wird und nicht in einem unkontrollierten Kanal liegt"
      - "Verlorene Zeit für das Verfassen von Telefonaten statt für die Analyse"
    title: "Sonabrief für Finanzanalysten: kursrelevante Informationen unter Kontrolle halten"
    description: "Ein Meeting-Assistent, der auf den kontrollierten Umgang mit sensiblen Informationen ausgelegt ist. Vor jeder Aufnahme entscheiden Sie, ob das Audio auf Ihrem eigenen Gerät oder auf europäischen Servern transkribiert wird. Die Aufnahme wird nie als Datei gespeichert."
    intro: |
      Die Besprechungen und Telefonate eines Analysten können Informationen enthalten, die nicht öffentlich gemacht wurden und einen Kurs bewegen würden, wenn sie es wären: ein Telefonat mit dem Management, eine Expert-Network-Sitzung, eine interne Erörterung einer Position. Nach der Marktmissbrauchsverordnung (MAR) ist eine Insiderinformation genau diese Art von nicht öffentlichem, kursrelevantem Material, und von Unternehmen wird erwartet, dass sie deren Fluss kontrolliert halten, statt ihn über unkontrollierte Kanäle zu verstreuen. Die Aufnahme eines solchen Gesprächs ist dessen vollständigste Kopie. Die meisten allgemeinen Transkriptionswerkzeuge behandeln diese Aufnahme wie beliebigen Inhalt: Sie laden sie hoch, verarbeiten sie auf Servern im Ausland und verwenden sie in mehreren Fällen erneut, um ihre Modelle zu verbessern, was genau der unkontrollierte Kanal ist, den eine Compliance-Funktion zu schließen versucht.

      Sonabrief geht von einer anderen Grundannahme aus. Vor jeder Aufnahme entscheiden Sie, wie das Audio behandelt wird. Sie können vollständig **auf Ihrem eigenen Gerät** transkribieren, sodass die Aufnahme nirgendwo hochgeladen wird und in Ihrer kontrollierten Umgebung bleibt. Oder Sie wählen die Transkription auf **europäischen Servern**, wenn Sie mehr Geschwindigkeit brauchen: Dann wird das Audio in der EU verarbeitet und danach nicht aufbewahrt. Es ist eine bewusste Entscheidung, die Sie jedes Mal treffen.

      ## So sieht der Ablauf aus

      Sie nehmen ein Telefonat oder eine Besprechung auf, und Sonabrief übergibt Ihnen einen sauberen, strukturierten schriftlichen Entwurf: Sie prüfen ihn, vollenden ihn mit Ihren eigenen Worten und nutzen ihn für Ihre Notizen. Sie beginnen mit einem fertigen Text statt mit einem leeren Blatt, und die Fassung, die zählt, bleibt Ihre. Das ursprüngliche Audio wird nach der Transkription nicht als Datei gespeichert, sodass ein Gespräch, das eine Insiderinformation enthalten könnte, nicht auf dem Server eines Dritten außerhalb der Kontrolle Ihres Unternehmens landet.

      ## Was das Werkzeug nicht tut, und was bei Ihnen bleibt

      Sonabrief ist ein Werkzeug, kein Compliance-Programm. Es entscheidet nicht, ob ein Telefonat aufgenommen werden darf, ob ein Gespräch eine Insiderinformation enthält oder was die Richtlinien Ihres Unternehmens und die anwendbaren Marktmissbrauchsregeln verlangen. Diese Beurteilungen bleiben Ihre und die Ihrer Compliance-Funktion. Die Software ist quelloffen, sodass Ihr Compliance- oder Sicherheitsteam genau prüfen kann, wie das Audio verarbeitet wird, statt sich auf ein Marketingversprechen zu verlassen.

      Nichts davon ist eine Rechts- oder Compliance-Beratung. Es ist eine Beschreibung der Funktionsweise des Werkzeugs, damit Sie entscheiden können, ob es zu der Arbeitsweise passt, zu der Sie verpflichtet sind und für die Sie sich entschieden haben.
    faq:
      - q: "Wird das Audio des Telefonats in die Cloud hochgeladen?"
        a: "Das hängt von der Entscheidung ab, die Sie vor jeder Aufnahme treffen. Wenn Sie die Transkription auf dem Gerät wählen, bleibt das Audio auf Ihrem Computer und wird nie hochgeladen. Wenn Sie für mehr Geschwindigkeit die Transkription auf europäischen Servern wählen, wird das Audio in der EU verarbeitet und nach der Transkription nicht aufbewahrt."
      - q: "Wie hilft das, sensible Informationen unter Kontrolle zu halten?"
        a: "Die Transkription auf dem Gerät hält die Aufnahme in Ihrer kontrollierten Umgebung, fern von jedem Server Dritter, was die richtige Haltung ist, wenn ein Gespräch kursrelevante Informationen oder eine Insiderinformation enthalten kann. Wenn Sie die Transkription in der europäischen Cloud wählen, findet die Verarbeitung in der EU statt und danach wird nichts aufbewahrt. Was Ihre Pflichten zum Marktmissbrauch verlangen, bleibt die Verantwortung Ihres Unternehmens. Dies ist keine Compliance-Beratung."
      - q: "Kann mein Compliance-Team diese Angaben überprüfen?"
        a: "Ja. Sonabrief ist quelloffen, sodass der Code, der das Audio verarbeitet, direkt geprüft werden kann, statt sich auf ein Versprechen zu verlassen. Ihr Compliance- oder Sicherheitsteam kann überprüfen, wie sich Aufnahme, Transkription und Speicherung tatsächlich verhalten."
      - q: "Werden meine Telefonate zum Trainieren von KI-Modellen verwendet?"
        a: "Nein. Ihre Telefonate werden nie zum Trainieren irgendeines Modells verwendet. Wenn Sie eine schriftliche Zusammenfassung anfordern, läuft sie entweder auf Ihrem eigenen Gerät oder auf europäischen Servern, die nach der Verarbeitung der Anfrage nichts aufbewahren."
      - q: "Wo werden meine Daten gehostet?"
        a: "Sonabrief nutzt europäische Infrastruktur, und Cloud-Zusammenfassungen laufen auf europäischen Servern, die nach der Verarbeitung einer Anfrage nichts aufbewahren. Die Transkription auf dem Gerät vermeidet das Hochladen vollständig, wenn Sie lieber möchten, dass nichts Ihre Maschine verlässt."
